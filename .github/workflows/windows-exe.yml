name: Windows executable

on:
  push:
    branches:
      - main
      - windows-exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip -r windows/requirements.txt

      - name: Build command-line executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name is-gpt-nerfed --add-data "plugin;plugin"
          windows/nerfed_launcher.py

      - name: Build Windows desktop UI executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name is-gpt-nerfed-ui --add-data "plugin;plugin"
          --add-data "macos/Sources/IsGPTNerfed/Resources/zh-Hans.lproj/Localizable.strings;localization"
          --add-data "macos/Resources;resources"
          windows/ui_launcher.py

      - name: Run Windows regression suite
        shell: pwsh
        run: |
          $env:NERFED_FROZEN_UI_TEST = (Resolve-Path ".\dist\is-gpt-nerfed-ui.exe").Path
          python -W ignore -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "Windows regression suite failed" }
          .\dist\is-gpt-nerfed.exe selftest
          python -m py_compile windows\ui.py windows\ui_launcher.py windows\nerfed_launcher.py
          $env:QT_QPA_PLATFORM = "offscreen"
          $smoke = Start-Process -FilePath ".\dist\is-gpt-nerfed-ui.exe" -ArgumentList "--smoke-test", "dist/ui-smoke.json" -PassThru -Wait -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0 -or !(Test-Path "dist/ui-smoke.json")) { throw "Frozen UI smoke test failed" }
          Get-Content "dist/ui-smoke.json"
          $backend = Start-Process -FilePath ".\dist\is-gpt-nerfed-ui.exe" -ArgumentList "selftest" -PassThru -Wait -WindowStyle Hidden
          if ($backend.ExitCode -ne 0) { throw "Windowed backend command failed" }

      - name: Package artifact
        shell: pwsh
        run: |
          $stage = "dist\package"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist\is-gpt-nerfed.exe" "$stage\is-gpt-nerfed.exe"
          Copy-Item "dist\is-gpt-nerfed-ui.exe" "$stage\is-gpt-nerfed-ui.exe"
          Copy-Item "LICENSE" "$stage\LICENSE"
          @"
          Double-click is-gpt-nerfed-ui.exe to open the Windows desktop/tray panel.
          Use is-gpt-nerfed.exe from PowerShell for diagnostics and CLI commands.
          The first command copies the bundled Codex plugin into your local Codex data directory.
          Example: .\is-gpt-nerfed.exe setup
          "@ | Set-Content "$stage\README-Windows.txt" -Encoding utf8
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\is-gpt-nerfed-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: is-gpt-nerfed-windows-${{ github.sha }}
          path: dist/is-gpt-nerfed-windows.zip
          if-no-files-found: error
          retention-days: 14
